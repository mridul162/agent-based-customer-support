version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    env_file:
      - ../.env.docker

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: